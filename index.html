<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="나만의 캐릭터">
<meta name="theme-color" content="#ffe9f3">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-180.png">
<title>나만의 3D 캐릭터 꾸미기</title>
<style>
:root{--bg:#fff5fa;--panel:#ffffff;--ink:#3a2a3a;--sub:#8a7a8a;--accent:#ff6fa5;--accent2:#a78bfa;--chip:#fff0f6;--line:#f3dbe7;--glow:none;--font:"Apple SD Gothic Neo","Noto Sans KR","Noto Sans CJK KR","NanumGothic",system-ui,sans-serif;--head:var(--font)}
body[data-concept=f]{--bg:#1d140d;--panel:#2a1f15;--ink:#f3e6c8;--sub:#bba98a;--accent:#e0b445;--accent2:#b5763a;--chip:#3a2c1e;--line:#4a3a28;--head:"AppleMyungjo","Noto Serif KR","Noto Serif CJK KR",serif}
body[data-concept=c]{--bg:#07050f;--panel:#110c20;--ink:#e6f7ff;--sub:#8fa3c0;--accent:#2ff5ff;--accent2:#ff4fd8;--chip:#1b1430;--line:#2a2148;--glow:0 0 12px rgba(47,245,255,.55)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:var(--font);overscroll-behavior:none;touch-action:pan-x pan-y;-webkit-text-size-adjust:100%}
body{display:flex;flex-direction:column;height:100vh;height:100dvh;overflow:hidden;transition:background .3s;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
input,textarea{-webkit-user-select:text;user-select:text}
#controls,#cardBody{touch-action:pan-y}.tabs,#subtabs,.chips{touch-action:pan-x pan-y}input[type=range]{touch-action:pan-y}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
#top{display:flex;align-items:center;gap:8px;padding:calc(env(safe-area-inset-top) + 8px) 12px 8px;background:var(--panel);border-bottom:1px solid var(--line);flex-wrap:wrap}
#top h1{font:800 16px var(--head);margin:0;letter-spacing:-.02em;white-space:nowrap;color:var(--accent);text-shadow:var(--glow)}
#nameBtn{display:flex;align-items:center;gap:4px;padding:5px 10px;border-radius:999px;background:var(--chip);font-weight:700;font-size:14px;border:1px solid var(--line)}
#nameBtn input{width:90px;border:0;background:transparent;font:inherit;color:inherit;outline:none}
#nameBtn::after{content:"✎";font-size:11px;color:var(--sub)}
#concept{display:flex;background:var(--chip);border-radius:999px;padding:3px;margin-left:auto;border:1px solid var(--line)}
#concept button{padding:6px 11px;border-radius:999px;font-size:13px;font-weight:700;color:var(--sub);white-space:nowrap}
#concept button.on{background:var(--accent);color:#fff;box-shadow:var(--glow)}
body[data-concept=c] #concept button.on{color:#05020a}
body[data-concept=f] #concept button.on{color:#2a1a08}
.allTog{font-size:11px;color:var(--sub);display:flex;align-items:center;gap:4px;white-space:nowrap}
#stage{position:relative;flex:0 0 47vh;flex:0 0 47dvh;min-height:240px;overflow:hidden;touch-action:none;--fab:50px}
#stage canvas{display:block}
.fab{position:absolute;right:8px;top:52px;display:flex;flex-direction:column;gap:7px;z-index:3}
.fab button,#cardBtn,.allTog,#focusBtn{background:var(--panel)}
.fab button,#cardBtn,.allTog{background:color-mix(in srgb,var(--panel) 86%,transparent);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border:1px solid var(--line);box-shadow:0 2px 10px rgba(0,0,0,.12)}
.fab button{width:var(--fab);height:var(--fab);border-radius:16px;font-size:10px;font-weight:700;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;color:var(--ink)}
.fab button i{font-style:normal;font-size:19px;line-height:1}
.fab-compact .fab button{border-radius:13px;font-size:9px}.fab-compact .fab button i{font-size:16px}
.fab-tiny .fab button{font-size:0;gap:0}.fab-tiny .fab button i{font-size:17px}
#cardBtn{position:absolute;right:8px;bottom:24px;z-index:3;border-radius:999px;padding:11px 16px;font-size:14px;font-weight:800;background:var(--accent);color:#fff;border-color:transparent;box-shadow:var(--glow),0 4px 14px rgba(0,0,0,.2)}
body[data-concept=c] #cardBtn{color:#05020a}
body[data-concept=f] #cardBtn{color:#2a1a08}
.allTog{position:absolute;left:8px;top:10px;z-index:3;border-radius:999px;padding:6px 10px;font-weight:700;color:var(--ink)}
#focusBtn{position:absolute;top:10px;right:10px;font-size:12px;font-weight:700;background:color-mix(in srgb,var(--panel) 86%,transparent);border:1px solid var(--line);border-radius:999px;padding:7px 11px;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
#panel{flex:1;display:flex;flex-direction:column;min-height:0;background:var(--panel);border-top:1px solid var(--line);border-radius:18px 18px 0 0;margin-top:-14px;position:relative;z-index:2;box-shadow:0 -6px 20px rgba(0,0,0,.08)}
.tabs{display:flex;gap:4px;overflow-x:auto;padding:10px 10px 6px;scrollbar-width:none;flex:none}
.tabs::-webkit-scrollbar,#subtabs::-webkit-scrollbar{display:none}
.tab{display:flex;flex-direction:column;align-items:center;gap:1px;padding:6px 10px;border-radius:12px;font-size:12px;font-weight:700;color:var(--sub);flex:none;min-width:56px}
.tab .ti{font-size:19px;line-height:1.1}
.tab.on{background:var(--chip);color:var(--accent);box-shadow:inset 0 0 0 1.5px var(--accent)}
.tab.special{position:relative}.tab.special::after{content:"";position:absolute;top:5px;right:8px;width:6px;height:6px;border-radius:50%;background:var(--accent2)}
#subtabs{display:flex;gap:6px;overflow-x:auto;padding:2px 10px 8px;border-bottom:1px solid var(--line);flex:none;scrollbar-width:none}
.sub{padding:6px 12px;border-radius:999px;font-size:13px;font-weight:700;background:var(--chip);color:var(--sub);flex:none;border:1px solid transparent}
.sub.on{color:var(--ink);border-color:var(--accent);background:color-mix(in srgb,var(--accent) 16%,var(--chip))}
#controls{flex:1;overflow-y:auto;padding:10px 14px calc(env(safe-area-inset-bottom) + 24px);-webkit-overflow-scrolling:touch}
.ctl{margin:4px 0 14px}
.lab{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:700;margin-bottom:7px;color:var(--ink)}
.lab .val{margin-left:auto;font-variant-numeric:tabular-nums;color:var(--sub);font-weight:600;font-size:12px}
.lab.grp{margin-top:12px;color:var(--accent)}
.mini{width:26px;height:26px;border-radius:50%;background:var(--chip);font-size:13px;color:var(--sub);border:1px solid var(--line);flex:none}
.mini.danger{width:auto;padding:0 10px;border-radius:999px;color:#e0405a}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{padding:8px 12px;border-radius:12px;background:var(--chip);font-size:13px;font-weight:600;border:1.5px solid transparent;min-height:36px}
.chip.on{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 18%,var(--chip));box-shadow:var(--glow)}
.chip.t-f{background-image:linear-gradient(135deg,transparent 78%,rgba(224,180,69,.45) 78%)}
.chip.t-c{background-image:linear-gradient(135deg,transparent 78%,rgba(255,79,216,.45) 78%)}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:30px;background:transparent;margin:0}
input[type=range]::-webkit-slider-runnable-track{height:6px;border-radius:3px;background:linear-gradient(90deg,var(--accent2),var(--accent))}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:26px;height:26px;border-radius:50%;background:#fff;border:3px solid var(--accent);margin-top:-10px;box-shadow:0 2px 6px rgba(0,0,0,.2)}
input[type=range]::-moz-range-track{height:6px;border-radius:3px;background:linear-gradient(90deg,var(--accent2),var(--accent))}
input[type=range]::-moz-range-thumb{width:22px;height:22px;border-radius:50%;background:#fff;border:3px solid var(--accent)}
.swatches{display:flex;flex-wrap:wrap;gap:8px}
.sw{width:34px;height:34px;border-radius:50%;background:var(--c);box-shadow:inset 0 0 0 1px rgba(0,0,0,.12);position:relative;flex:none}
.sw.on{box-shadow:0 0 0 2px var(--panel),0 0 0 4px var(--accent)}
.sw.custom{background:conic-gradient(red,yellow,lime,cyan,blue,magenta,red);display:grid;place-items:center;overflow:hidden}
.sw.custom span{color:#fff;font-weight:900;text-shadow:0 1px 2px #000}
.picker{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer}
.switch{display:flex;align-items:center;gap:10px;cursor:pointer}
.switch .lab{margin:0;flex:1}
.switch input{display:none}
.switch .knob{width:46px;height:28px;border-radius:14px;background:var(--line);position:relative;transition:.2s;flex:none}
.switch .knob::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:.2s;box-shadow:0 1px 3px rgba(0,0,0,.3)}
.switch input:checked+.knob{background:var(--accent)}
.switch input:checked+.knob::after{left:21px}
#compliment{position:absolute;bottom:78px;left:10px;right:calc(var(--fab) + 18px);display:flex;justify-content:center;transform:translateY(24px) scale(.85);opacity:0;pointer-events:none;transition:.45s cubic-bezier(.2,1.6,.4,1);z-index:5}
#compliment.show{opacity:1;transform:translateY(0) scale(1)}
#compliment .msg{background:var(--panel);color:var(--ink);padding:10px 16px;border-radius:20px;font-weight:800;font-size:14px;max-width:100%;text-align:center;box-shadow:0 8px 28px rgba(0,0,0,.18),var(--glow);border:2px solid var(--accent);line-height:1.4;word-break:keep-all}
#compliment .fx{position:absolute;left:50%;top:50%}
#compliment .fx span{position:absolute;color:var(--accent);font-size:18px;opacity:0}
#compliment.show .fx span{animation:burst 1.3s ease-out var(--d) forwards}
@keyframes burst{0%{transform:translate(0,0) scale(.4);opacity:1}100%{transform:translate(var(--x),var(--y)) scale(1.2) rotate(40deg);opacity:0}}
#toast{position:fixed;left:0;right:0;margin:0 auto;width:max-content;bottom:calc(env(safe-area-inset-bottom) + 18px);transform:translateY(160px);background:#2a2030;color:#fff;padding:10px 14px;border-radius:14px;font-size:13px;font-weight:600;display:flex;gap:10px;align-items:center;transition:.3s;z-index:50;max-width:92%}
#toast.show{transform:translateY(0)}
#toast span{word-break:keep-all}
#toast button{background:var(--accent);color:#fff;padding:6px 10px;border-radius:10px;font-weight:800;white-space:nowrap}
.modal{position:fixed;inset:0;z-index:40;display:none}
.modal.open{display:flex}
#slots{background:rgba(0,0,0,.45);align-items:flex-end;justify-content:center}
#slots .sheet{background:var(--panel);width:100%;max-width:520px;border-radius:20px 20px 0 0;padding:16px 16px calc(env(safe-area-inset-bottom) + 16px)}
#slots h3{margin:0 0 10px;font:800 17px var(--head);display:flex;justify-content:space-between}
.slot{display:flex;gap:10px;align-items:center;padding:8px;border-radius:14px;background:var(--chip);margin-bottom:8px}
.slot img,.slot .empty{width:54px;height:72px;border-radius:10px;object-fit:cover;background:var(--line);display:grid;place-items:center;font-size:11px;color:var(--sub);flex:none}
.slotInfo{flex:1;display:flex;flex-direction:column;gap:2px;font-size:13px}.slotInfo small{color:var(--sub)}
.slotBtns{display:flex;flex-direction:column;gap:5px}.slotBtns button{background:var(--accent);color:#fff;padding:6px 12px;border-radius:10px;font-weight:700;font-size:12px}
/* photocard */
#card{background:var(--bg);flex-direction:column}
.cardTop{display:flex;align-items:center;justify-content:space-between;padding:calc(env(safe-area-inset-top) + 8px) 12px 8px;background:var(--panel);border-bottom:1px solid var(--line)}
.cardTop b{font:800 16px var(--head)}
.ghost{padding:8px 10px;border-radius:10px;background:var(--chip);font-weight:700;font-size:13px}
.primary{padding:9px 14px;border-radius:12px;background:var(--accent);color:#fff;font-weight:800;font-size:14px;box-shadow:var(--glow)}
body[data-concept=c] .primary{color:#05020a}
.cardMain{flex:1;display:flex;flex-direction:column;min-height:0}
.cardPreview{flex:none;height:min(50vh,calc(100vw * 1.5 - 40px));height:min(50dvh,calc(100vw * 1.5 - 40px));display:flex;justify-content:center;align-items:center;padding:10px}
.cardWrap{position:relative;height:100%;aspect-ratio:2/3;border-radius:14px;overflow:hidden;box-shadow:0 10px 30px rgba(0,0,0,.25)}
#cardCanvas{width:100%;height:100%;display:block;touch-action:none;-webkit-user-select:none;user-select:none}
#selBox{position:absolute;border:2px dashed var(--accent);border-radius:8px;pointer-events:none;display:none;box-shadow:0 0 0 1px rgba(255,255,255,.6)}
.cardCtl{flex:1;min-height:0;display:flex;flex-direction:column;background:var(--panel);border-radius:18px 18px 0 0}
#cardBody{flex:1;overflow-y:auto;padding:8px 14px calc(env(safe-area-inset-bottom) + 20px)}
#selBar{display:none;gap:10px;align-items:center;padding:6px 12px;border-bottom:1px solid var(--line);font-size:12px;font-weight:700}
#selBar.on{display:flex}
#selBar label{flex:1;display:flex;align-items:center;gap:6px}#selBar label span{white-space:nowrap}
.thumbGrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(74px,1fr));gap:8px}
.thumb{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px;font-weight:700;padding:4px;border-radius:12px;border:2px solid transparent}
.thumb canvas{width:100%;aspect-ratio:2/3;border-radius:8px;box-shadow:0 2px 6px rgba(0,0,0,.15)}
.thumb.on{border-color:var(--accent)}
.stickerGrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(54px,1fr));gap:6px}
.stk{background:var(--chip);border-radius:12px;padding:4px}.stk canvas{width:100%;aspect-ratio:1}
.hint{font-size:12px;color:var(--sub);line-height:1.5}
.row{display:flex;gap:8px;margin:6px 0 12px}
.textInp{width:100%;padding:10px 12px;border-radius:12px;border:1.5px solid var(--line);background:var(--chip);color:var(--ink);font:inherit;font-size:16px}
#dlView{background:rgba(0,0,0,.7);align-items:center;justify-content:center;z-index:60}
.dlBox{background:var(--panel);padding:14px;border-radius:18px;max-width:92vw;text-align:center}
.dlBox img{max-height:62vh;max-height:62dvh;max-width:100%;border-radius:12px}
.dlBox p{font-size:13px;color:var(--sub)}
@media (max-width:460px){#top h1 span{display:none}#concept button{padding:6px 10px}}
#loading{position:absolute;inset:0;display:grid;place-items:center;font-weight:800;color:var(--sub)}
@supports not (background:color-mix(in srgb,red 50%,blue)){
  .fab button,.allTog,#focusBtn{background:var(--panel)}
  .sub.on{background:var(--chip);box-shadow:inset 0 0 0 1.5px var(--accent)}
  .chip.on{background:var(--chip);box-shadow:inset 0 0 0 2px var(--accent),var(--glow)}
}
/* phone in landscape: stage left, panel right */
@media (orientation:landscape) and (max-height:540px){
  body{display:grid;grid-template-columns:1fr minmax(300px,48%);grid-template-rows:auto 1fr}
  #top{grid-column:1/3;padding-top:calc(env(safe-area-inset-top) + 4px);padding-bottom:4px;padding-left:max(12px,env(safe-area-inset-left));padding-right:max(12px,env(safe-area-inset-right))}
  #stage{flex:none;height:auto;min-height:0}
  #panel{margin:0;border-radius:0;border-left:1px solid var(--line);border-top:0;padding-right:env(safe-area-inset-right)}
  .cardMain{flex-direction:row}.cardPreview{flex:1;height:auto;min-height:0}.cardCtl{width:48%;flex:none;border-radius:0}
}
@media (min-width:900px) and (min-aspect-ratio:1/1){
  body{display:grid;grid-template-columns:1fr 440px;grid-template-rows:auto 1fr}
  #top{grid-column:1/3}
  #stage{flex:none;height:auto;min-height:0}
  #panel{margin:0;border-radius:0;border-left:1px solid var(--line);border-top:0}
  .cardMain{flex-direction:row}.cardPreview{flex:1;height:auto}.cardCtl{width:440px;flex:none;border-radius:0}
}
</style>
</head>
<body data-concept="d">
<header id="top">
  <h1>✦<span> 나만의 캐릭터</span></h1>
  <button id="nameBtn" aria-label="이름 바꾸기"><span class="nm">승현</span></button>
  <div id="concept" role="tablist" aria-label="컨셉"></div>
</header>
<main id="stage">
  <div id="loading">캐릭터 준비 중…</div>
  <div id="compliment"><div class="fx"></div><div class="msg"></div></div>
  <div class="fab">
    <button id="randBtn"><i>🎲</i>랜덤</button>
    <button id="resetBtn"><i>↺</i>처음</button>
    <button id="saveBtn"><i>💾</i>저장</button>
    <button id="compBtn"><i>💖</i>칭찬</button>
  </div>
  <button id="cardBtn" class="hero">📸 포토카드</button>
  <label class="allTog"><input type="checkbox" id="showAll"> 모든 컨셉 아이템</label>
  <button id="focusBtn">얼굴 보기</button>
</main>
<section id="panel">
  <nav class="tabs" id="tabs"></nav>
  <nav id="subtabs"></nav>
  <div id="controls"></div>
</section>
<div id="slots" class="modal"><div class="sheet"><h3>저장 / 불러오기 <button class="close">닫기 ✕</button></h3><div id="slotList"></div><p class="hint">지금 모습은 자동으로 저장돼요. 여기에는 마음에 드는 코디를 4개까지 따로 보관할 수 있어요.</p></div></div>
<div id="toast"></div>
<script src="app.js"></script>
<script>document.getElementById('loading').remove()</script>
</body>
</html>
